# Optional Blueprint: wires DATABASE_URL from the database automatically.
databases:
  - name: arsenal-pro-db
    plan: free
    region: oregon
    databaseName: arsenal_pro_db
services:
  - type: web
    name: arsenal-pro-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arsenal-pro-db
          property: connectionString
