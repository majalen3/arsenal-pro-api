# Optional Blueprint: wires DATABASE_URL from the database automatically.
databases:
  - name: arsenal-pro-db
    plan: free
    region: oregon
    databaseName: arsenal_pro_db
services:
  - type: web
    name: arsenal-pro-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arsenal-pro-db
          property: connectionString
      # Optional accounts: HMAC key for session tokens. Render generates it; it never lives in the repo.
      # Rotating it signs everyone out (no data is lost).
      - key: SESSION_PEPPER
        generateValue: true
      # Origins allowed to call /api/auth/* and /api/account* (comma-separated). Device-code routes stay CORS *.
      - key: CORS_ORIGINS
        value: https://majalen3.github.io
