name: api-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: p, POSTGRES_USER: u, POSTGRES_DB: t }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U u" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: |
          DATABASE_URL=postgres://u:p@localhost:5432/t PGSSL=off PORT=8787 EVENT_QUOTA=50 node server.js &
          sleep 5
          BASE=http://localhost:8787 npm test
